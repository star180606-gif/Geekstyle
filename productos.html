<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Geekstyle | Tienda de ropa</title>

    <link rel="stylesheet" href="estilo3.css">

    <!-- Iconos -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>

<body>


<!-- =========================
     HEADER
========================= -->

<header class="header">

<div class="menu-container">

    <button class="hamburger" id="hamburger">☰</button>

    <div class="menu" id="menu">
        <a href="mujer.html">Mujer</a>
        <a href="hombre.html">Hombre</a>
        <a href="ninos.html">Niños</a>
       

        <a href="ofertas.html" class="sale">🔥 OFERTAS</a>
    </div>

</div>



    <div class="logo">
        Geekstyle<span></span>
    </div>

<div class="barra-de-busqueda">
    <input type="text" placeholder="buscar...">
 <button> <i class="fa-solid fa-magnifying-glass"></i></button>
</div>

  

    <div class="header-actions">
        <div class="header-item">
           <i class="fa-solid fa-phone"></i>
           <a href="CONTACTANOS.html">
            <span>Contáctanos</span>
           </a>
        </div>

        <div class="header-item">
            <i class="fa-regular fa-user"></i>
            <a href="Cuenta.html"></a>
            <span>Mi cuenta</span>
        </div>

       

        

    </div>
    


</header>
<section class="catalogo">

    <!-- CABECERA DE RESULTADOS -->
    <div class="catalogo-header">

        <div>
            <h1>PRODUCTOS</h1>
            <span class="cantidad-resultados">1728 resultados</span>
        </div>

        <div class="ordenar">
            <label for="orden">Ordenar por:</label>

            <select id="orden">
                <option>Relevancia</option>
                <option>Más vendidos</option>
                <option>Precio: menor a mayor</option>
                <option>Precio: mayor a menor</option>
                <option>Novedades</option>
            </select>
        </div>

        <button class="btn-filtros" id="btnFiltros">
            <i class="fa-solid fa-sliders"></i>
            Filtrar
        </button>

    </div>


    <!-- CONTENIDO -->
    


       
</section>

<script>
    const hamburger = document.getElementById("hamburger");
    const menu = document.getElementById("menu");

    hamburger.addEventListener("click", () => {
        const isOpen = menu.classList.toggle("active");
        hamburger.setAttribute("aria-expanded", isOpen);
    });

    document.addEventListener("click", (event) => {
        if (!hamburger.contains(event.target) && !menu.contains(event.target)) {
            menu.classList.remove("active");
            hamburger.setAttribute("aria-expanded", "false");
        }
    });

    document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
            menu.classList.remove("active");
            hamburger.setAttribute("aria-expanded", "false");
        }
    });
</script>

</body>
</html>
